version: "3"

tasks:
  fmt:
    desc: Run gofumpt for all packages
    cmds:
      - gofumpt -w .

  modernize:
    desc: Run modernize for all packages
    cmds:
      - modernize -fix ./...

  lint:
    desc: Run base linters for all packages
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run base linters for all packages and applies fixes if possible
    cmds:
      - golangci-lint run --fix

  test:
    desc: Run tests for all packages
    cmds:
      - go test ./... -count=1 {{.CLI_ARGS}}
  release:
    desc: Create and push a new tag following semver
    vars:
      NEXT:
        sh: svu next --always || go run github.com/caarlos0/svu/v3@latest next --always
    prompt: "This will release {{.NEXT}}. Continue?"
    preconditions:
      - sh: '[ $(git symbolic-ref --short HEAD) = "main" ]'
        msg: Not on main branch
      - sh: "[ $(git status --porcelain=2 | wc -l) = 0 ]"
        msg: "Git is dirty"
    cmds:
      - git commit --allow-empty -m "{{.NEXT}}"
      - git tag --annotate --sign -m "{{.NEXT}}" {{.NEXT}} {{.CLI_ARGS}}
      - echo "Pushing {{.NEXT}}..."
      - git push origin main --follow-tags

  mlflow:start:
    desc: Start MLflow server with PostgreSQL backend
    preconditions:
      - sh: command -v docker
        msg: Docker is not installed. Please install Docker to use MLflow server.
      - sh: docker info > /dev/null 2>&1
        msg: Docker daemon is not running. Please start Docker.
    cmds:
      - docker compose up -d
      - echo "MLflow server starting at http://localhost:5000"
      - echo "Use 'task mlflow:logs' to view server logs"

  mlflow:stop:
    desc: Stop MLflow server and PostgreSQL
    cmds:
      - docker compose down

  mlflow:logs:
    desc: View MLflow server logs
    cmds:
      - docker compose logs -f mlflow

  proto:deps:
    desc: Install buf if not present
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@latest

  proto:gen:
    desc: Generate Go code from protos using buf
    dir: proto
    cmds:
      - buf generate

  proto:lint:
    desc: Lint protos using buf
    dir: proto
    cmds:
      - buf lint

  proto:sync:
    desc: Update protos from mlflow-ref (see proto/README.md)
    dir: proto
    cmds:
      - echo "Syncing MLflow protos from mlflow-ref/mlflow/protos/"
      - echo "See proto/README.md for detailed sync instructions"
      - echo "This task is a reminder - manual curation required"
