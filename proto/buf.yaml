version: v2
# MLflow v3.8.0
modules:
  - path: .
    name: buf.build/fantasy/mlflow
lint:
  use:
    - DEFAULT
  except:
    - PACKAGE_VERSION_SUFFIX
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - ENUM_FIRST_VALUE_ZERO
  ignore:
    - google/protobuf
    - opentelemetry
    - scalapb
breaking:
  use:
    - FILE
